name: CI

on:
  pull_request:
    branches: [develop, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'alembic/**'
              - 'pyproject.toml'
              - 'uv.lock'
            frontend:
              - 'frontend/**'
            deps:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'

  lint-backend:
    name: Lint Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --frozen
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy src/ --ignore-missing-imports || true  # TODO: fix 90+ pre-existing errors then remove || true

  lint-frontend:
    name: Lint Frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint

  test-backend:
    name: Backend Unit Tests
    needs: [detect-changes, lint-backend]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      !contains(needs.lint-backend.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --frozen
      - run: uv run pytest tests/unit/ -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 7

  test-frontend:
    name: Frontend Tests
    needs: [detect-changes, lint-frontend]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend == 'true' &&
      !contains(needs.lint-frontend.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx vitest run

  test-integration:
    name: Integration Tests
    needs: [detect-changes, lint-backend]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      !contains(needs.lint-backend.result, 'failure')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cognify
          POSTGRES_PASSWORD: cognify
          POSTGRES_DB: cognify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --frozen
      - name: Run migrations
        env:
          COGNIFY_DATABASE_URL: postgresql+asyncpg://cognify:cognify@localhost:5432/cognify
        run: uv run alembic upgrade head
      - name: Run integration tests
        env:
          COGNIFY_DATABASE_URL: postgresql+asyncpg://cognify:cognify@localhost:5432/cognify
        run: uv run pytest tests/integration/ -v --tb=short

  security:
    name: Security Scan
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.deps == 'true' ||
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --frozen
      - name: Python dependency audit
        run: uv run pip-audit || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Frontend dependency audit
        run: cd frontend && npm audit --audit-level=high || true
