name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}

jobs:
  build-images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cognify-api
            file: Dockerfile.api
          - image: cognify-worker
            file: Dockerfile.worker
          - image: cognify-frontend
            file: Dockerfile.frontend
            build-args: NEXT_PUBLIC_API_BASE_URL=/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Uncomment when AWS ECR is provisioned:
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ${{ secrets.AWS_REGION }}
      #
      # - name: Login to Amazon ECR
      #   uses: aws-actions/amazon-ecr-login@v2

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: false  # Set to true when ECR is ready
          load: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          build-args: ${{ matrix.build-args || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-staging:
    name: Deploy to Staging
    needs: build-images
    runs-on: ubuntu-latest
    # Uncomment when staging environment is configured:
    # environment: staging
    steps:
      - name: Placeholder
        run: echo "Staging deployment placeholder — Helm charts not yet created"

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    # Uncomment when production environment is configured:
    # environment:
    #   name: production
    #   url: https://api.cognify.app
    steps:
      - name: Placeholder
        run: echo "Production deployment placeholder — requires manual approval and Helm charts"
