name: CD

on:
  push:
    branches: [staging]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'alembic/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile.api'
              - 'Dockerfile.worker'
              - 'docker-entrypoint.sh'
            frontend:
              - 'frontend/**'
              - 'Dockerfile.frontend'

  build-api:
    name: Build API
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Uncomment when AWS ECR is provisioned:
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ${{ secrets.AWS_REGION }}
      # - uses: aws-actions/amazon-ecr-login@v2

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: |
            cognify-api:${{ github.sha }}
            cognify-api:latest
          cache-from: type=gha,scope=cognify-api
          cache-to: type=gha,mode=max,scope=cognify-api

  build-worker:
    name: Build Worker
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: false
          load: true
          tags: |
            cognify-worker:${{ github.sha }}
            cognify-worker:latest
          cache-from: type=gha,scope=cognify-worker
          cache-to: type=gha,mode=max,scope=cognify-worker

  build-frontend:
    name: Build Frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: |
            cognify-frontend:${{ github.sha }}
            cognify-frontend:latest
          build-args: NEXT_PUBLIC_API_BASE_URL=/api/v1
          cache-from: type=gha,scope=cognify-frontend
          cache-to: type=gha,mode=max,scope=cognify-frontend

  deploy-staging:
    name: Deploy to Staging
    needs: [build-api, build-worker, build-frontend]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    # Uncomment when staging environment is configured:
    # environment: staging
    steps:
      - name: Placeholder
        run: echo "Staging deployment placeholder — Ubuntu server details TBD"
      # TODO: Add SSH deploy or docker-compose pull on staging Ubuntu server
      # - name: Deploy to staging server
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.STAGING_HOST }}
      #     username: ${{ secrets.STAGING_USER }}
      #     key: ${{ secrets.STAGING_SSH_KEY }}
      #     script: |
      #       cd /opt/cognify
      #       docker compose pull
      #       docker compose up -d

  # Auto-merge staging to main (temporary — remove when production server is in place)
  sync-to-main:
    name: Sync Staging to Main
    needs: deploy-staging
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Merge staging into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/staging --no-edit
          git push origin main
