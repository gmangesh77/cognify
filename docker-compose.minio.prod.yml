# Production MinIO bring-up (Phase 6 / VISUAL-009).
#
# Layered on top of `docker-compose.yml` for self-hosted production
# rollouts that don't yet have AWS S3 / GCS provisioned. Differs from
# `docker-compose.minio.yml` (the dev overlay) in three ways:
#
#   1. Reads MinIO credentials from environment variables — no
#      hard-coded `cognify_dev` defaults. Operators MUST set
#      `COGNIFY_MINIO_ROOT_USER` / `COGNIFY_MINIO_ROOT_PASSWORD`
#      before `up`.
#   2. Sets resource limits + `unless-stopped` restart policy.
#   3. Applies the lifecycle policy from `infra/minio/lifecycle.json`
#      (90-day archive) via the bucket-init sidecar.
#
# Usage:
#
#   export COGNIFY_MINIO_ROOT_USER=<rotated-user>
#   export COGNIFY_MINIO_ROOT_PASSWORD=<rotated-secret>
#   docker compose -f docker-compose.yml -f docker-compose.minio.prod.yml \
#     up -d minio minio-bucket-init
#
# The runbook in `docs/deployment/visual-storage-rollout.md` walks
# through the rotation, provisioning, and verification flow end to end.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-01T00-00-00Z
    container_name: cognify-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${COGNIFY_MINIO_ROOT_USER:?must be set in env}
      MINIO_ROOT_PASSWORD: ${COGNIFY_MINIO_ROOT_PASSWORD:?must be set in env}
      MINIO_BROWSER_REDIRECT_URL: ${COGNIFY_MINIO_CONSOLE_URL:-}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
        reservations:
          cpus: "0.5"
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  minio-bucket-init:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    container_name: cognify-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${COGNIFY_MINIO_ROOT_USER:?must be set in env}
      MINIO_ROOT_PASSWORD: ${COGNIFY_MINIO_ROOT_PASSWORD:?must be set in env}
      COGNIFY_MINIO_BUCKET: ${COGNIFY_MINIO_BUCKET:-cognify-visuals}
    volumes:
      - ./infra/minio:/lifecycle:ro
    entrypoint: >
      /bin/sh -c "
      set -eu;
      mc alias set local http://minio:9000 \
        \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb --ignore-existing local/\"$$COGNIFY_MINIO_BUCKET\";
      mc anonymous set download local/\"$$COGNIFY_MINIO_BUCKET\";
      mc ilm import local/\"$$COGNIFY_MINIO_BUCKET\" < /lifecycle/lifecycle.json;
      mc admin prometheus generate local > /tmp/prom.yaml || true;
      echo \"bucket $$COGNIFY_MINIO_BUCKET ready (lifecycle applied)\";
      "

volumes:
  minio-data:
    name: cognify-minio-data
