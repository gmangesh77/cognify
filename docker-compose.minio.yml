# MinIO local development bring-up.
#
# Spin up alongside the main docker-compose:
#
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d minio
#
# Console:    http://localhost:9001  (login: cognify_dev / cognify_dev_secret)
# S3 API:     http://localhost:9000
# Bucket auto-created on first start: cognify-visuals (public read).
#
# Set in `.env` to enable the MinIO object_storage in the API:
#   COGNIFY_MINIO_ENABLED=true
#   COGNIFY_MINIO_ENDPOINT=localhost:9000
#   COGNIFY_MINIO_ACCESS_KEY=cognify_dev
#   COGNIFY_MINIO_SECRET_KEY=cognify_dev_secret
#   COGNIFY_MINIO_BUCKET=cognify-visuals
#   COGNIFY_MINIO_PUBLIC_URL=http://localhost:9000
#   COGNIFY_MINIO_USE_SSL=false
#
# Phase 6 (production rollout) replaces this with a managed MinIO/S3.

services:
  minio:
    image: minio/minio:latest
    container_name: cognify-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cognify_dev
      MINIO_ROOT_PASSWORD: cognify_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-bucket-init:
    image: minio/mc:latest
    container_name: cognify-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cognify_dev cognify_dev_secret &&
      mc mb --ignore-existing local/cognify-visuals &&
      mc anonymous set download local/cognify-visuals &&
      echo 'cognify-visuals bucket ready';
      "

volumes:
  minio-data:
    name: cognify-minio-data
